<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sidequest P0 Wireframe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: presenter stage. Live 390x844 phone on the left, a quiet decision panel on the right; stacks under 900px. */
:root{
  /* Wireframe: grayscale only, system fonts. Shows flow and data, not visual design. */
  --fg:#1c1c1c; --fg-2:#3d3d3d; --muted:#6b6b6b; --faint:#9a9a9a;
  --page:#e6e6e6; --surface:#ffffff; --surface-2:#f2f2f2; --surface-3:#e4e4e4; --line:#d6d6d6; --line-strong:#b8b8b8;
  --btn:#3a3a3a; --btn-fg:#ffffff;
  --blue:#3a3a3a; --blue-tint:#ececec; --blue-ink:#2b2b2b;
  --green:#3a3a3a; --green-tint:#e2e2e2; --green-ink:#1c1c1c;
  --orange:#7a7a7a; --orange-tint:#f0f0f0; --orange-ink:#2b2b2b;
  --red:#3a3a3a; --red-tint:#ececec;
  --frame:#4a4a4a; --overlay:rgba(0,0,0,.35); --shadow:0 0 0 1px #d6d6d6;
  --map-land:#f4f4f4; --map-block:#e8e8e8; --map-water:#d4d4d4; --map-park:#e0e0e0; --map-road:#ffffff; --map-hwy:#cfcfcf; --map-hwy-edge:#bdbdbd; --map-label:#8a8a8a; --map-water-label:#6b6b6b;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --m:20px; --pad:16px; --sec:24px; --r-card:16px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fg:#ececec; --fg-2:#cfcfcf; --muted:#9e9e9e; --faint:#6e6e6e;
  --page:#0f0f0f; --surface:#1a1a1a; --surface-2:#242424; --surface-3:#2e2e2e; --line:#333333; --line-strong:#4a4a4a;
  --btn:#e0e0e0; --btn-fg:#141414;
  --blue:#d6d6d6; --blue-tint:#2a2a2a; --blue-ink:#e6e6e6;
  --green:#d6d6d6; --green-tint:#303030; --green-ink:#f0f0f0;
  --orange:#a8a8a8; --orange-tint:#262626; --orange-ink:#e0e0e0;
  --red:#d6d6d6; --red-tint:#2a2a2a;
  --frame:#3a3a3a; --overlay:rgba(0,0,0,.55); --shadow:0 0 0 1px #333333;
  --map-land:#1c1c1c; --map-block:#252525; --map-water:#333333; --map-park:#2a2a2a; --map-road:#2e2e2e; --map-hwy:#3a3a3a; --map-hwy-edge:#454545; --map-label:#8a8a8a; --map-water-label:#a0a0a0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --fg:#ececec; --fg-2:#cfcfcf; --muted:#9e9e9e; --faint:#6e6e6e;
  --page:#0f0f0f; --surface:#1a1a1a; --surface-2:#242424; --surface-3:#2e2e2e; --line:#333333; --line-strong:#4a4a4a;
  --btn:#e0e0e0; --btn-fg:#141414;
  --blue:#d6d6d6; --blue-tint:#2a2a2a; --blue-ink:#e6e6e6;
  --green:#d6d6d6; --green-tint:#303030; --green-ink:#f0f0f0;
  --orange:#a8a8a8; --orange-tint:#262626; --orange-ink:#e0e0e0;
  --red:#d6d6d6; --red-tint:#2a2a2a;
  --frame:#3a3a3a; --overlay:rgba(0,0,0,.55); --shadow:0 0 0 1px #333333;
  --map-land:#1c1c1c; --map-block:#252525; --map-water:#333333; --map-park:#2a2a2a; --map-road:#2e2e2e; --map-hwy:#3a3a3a; --map-hwy-edge:#454545; --map-label:#8a8a8a; --map-water-label:#a0a0a0;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--page);color:var(--fg)}
body{font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Stage ---------- */
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding-block:32px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{flex:none;padding:11px;background:var(--frame);border-radius:58px;box-shadow:0 30px 80px rgba(10,10,11,.22)}
.phone{position:relative;width:390px;height:844px;border-radius:47px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;isolation:isolate}
.device{position:sticky;top:24px}
.panel{width:360px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width: 900px){
  .device{position:static}
  .stage{flex-direction:column;align-items:center;gap:24px;padding-block:16px 32px}
  .panel{position:static;width:100%;max-width:412px}
}
@media (max-width: 460px){
  .device{padding:0;border-radius:28px;width:100%;box-shadow:none;border:1px solid var(--line)}
  .phone{width:100%;height:780px;border-radius:27px}
}

/* ---------- Panel ---------- */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;flex:none}
.brand h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.ph{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--fg)}
.ph small{font-weight:400;color:var(--muted)}
.idx{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.idx button{width:100%;text-align:left;display:flex;gap:8px;align-items:center;min-height:36px;padding:6px 10px;border:0;border-radius:10px;background:transparent;font-size:13px;color:var(--fg-2)}
.idx button:hover{background:var(--surface-2)}
.idx button[aria-current="true"]{background:var(--btn);color:var(--btn-fg)}
.idx .n{font-variant-numeric:tabular-nums;color:var(--faint);width:16px;flex:none;font-size:12px}
.idx button[aria-current="true"] .n{color:inherit;opacity:.6}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border:0;border-radius:var(--r-pill);background:transparent;font-size:13px;font-weight:500;color:var(--muted);padding:0 10px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(10,10,11,.12)}
.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--fg-2)}
.notes b{color:var(--fg);font-weight:600}
.notes code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.demo{display:flex;flex-wrap:wrap;gap:6px}
.demo button{min-height:36px;padding:0 12px;border-radius:var(--r-pill);border:1px dashed var(--line-strong);background:transparent;font-size:12.5px;font-weight:500}
.demo button:hover:not(:disabled){border-style:solid;background:var(--surface-2)}
.demo button:disabled{opacity:.4;cursor:not-allowed}
.demo .done{border-style:solid;border-color:var(--green);color:var(--green-ink)}
.tally-log{font-size:12.5px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}

/* ---------- Phone chrome ---------- */
.sbar{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:600;z-index:6;position:relative}
.sbar .isl{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:33px;border-radius:20px;background:#000}
.sbar .sic{display:flex;gap:6px;align-items:center}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabs{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--surface);padding:6px 12px 26px;z-index:5}
.tab{flex:1;min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--faint);position:relative}
.tab[aria-current="page"]{color:var(--fg)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--fg);color:var(--surface);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

.nav{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;min-height:52px;flex:none}
.nav .t{font-weight:600;font-size:16px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--fg)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.solid{background:var(--surface);box-shadow:var(--shadow)}
.big{padding:4px var(--m) 4px}
.big h2{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1;text-wrap:balance}
.big p{margin:6px 0 0;color:var(--muted)}
.wrap{padding:0 var(--m) 32px;display:flex;flex-direction:column;gap:var(--sec)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h span{color:var(--muted);font-size:13px}
.quiet{opacity:.82}

/* ---------- Primitives ---------- */
.btn{min-height:48px;padding:0 20px;border-radius:var(--r-pill);border:0;background:var(--btn);color:var(--btn-fg);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.btn.sec2{background:var(--surface-2);color:var(--fg)}
.btn.line{background:transparent;border:1px solid var(--line-strong);color:var(--fg)}
.btn.blue{background:var(--btn);color:var(--btn-fg)}
.btn.danger{background:var(--btn);color:var(--btn-fg)}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px}
.link{border:0;background:transparent;color:var(--blue);font-weight:500;min-height:44px;padding:0 4px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--pad)}
.card.flat{background:var(--surface-2);border-color:transparent}
.chip{min-height:40px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.chip.friend[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.chip.on{border-color:var(--fg);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px var(--m)}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;line-height:1.35}
.tag.go{background:var(--green-tint);color:var(--green-ink)}
.tag.wait{background:var(--surface-2);color:var(--fg-2)}
.tag.no{background:var(--surface-3);color:var(--fg-2)}
.tag.att{background:var(--orange-tint);color:var(--orange-ink)}
.tag.blue{background:var(--blue-tint);color:var(--blue-ink)}
.tag.bad{background:var(--red-tint);color:var(--red)}
.tag.plain{background:transparent;color:var(--muted);padding:0}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--orange-tint);color:var(--orange-ink);font-size:14px;line-height:1.4}
.notice b{font-weight:700}
.notice.info{background:var(--blue-tint);color:var(--blue-ink)}
.notice.ok{background:var(--green-tint);color:var(--green-ink)}
.notice.bad{background:var(--red-tint);color:var(--red)}
.notice.neutral{background:var(--surface-2);color:var(--fg-2)}
.notice svg{flex:none;margin-top:1px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:var(--fg)}
.av.sm{width:28px;height:28px;font-size:12px}
.avs{display:flex}.avs .av{border:2px solid var(--surface);margin-left:-8px}.avs .av:first-child{margin-left:0}
.av-maya,.av-jordan,.av-sam{background:var(--surface-3);color:var(--fg)}
.av-priya,.av-luis,.av-tess{background:var(--surface-3);color:var(--fg)}.av-ana{background:var(--surface-3);color:var(--fg-2)}
.row{display:flex;align-items:center;gap:12px;min-height:44px}
.row .grow{flex:1;min-width:0}
.facts{display:flex;flex-direction:column}
.fact{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact .ic{width:20px;color:var(--muted);flex:none;margin-top:1px}
.fact .k{font-size:12.5px;color:var(--muted);margin-bottom:1px}
.fact .v{font-weight:500}
.fact .s{font-size:13px;color:var(--muted);margin-top:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.h-title{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--fg-2);font-weight:300;font-size:15.5px;line-height:1.55;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13.5px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.input{min-height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);padding:10px 14px;width:100%;font-size:15px}
textarea.input{min-height:96px;resize:vertical;line-height:1.45}
.input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.input.err{border-color:var(--red)}
.ferr{display:flex;gap:6px;align-items:center;color:var(--red);font-size:13px;font-weight:500}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:14px;font-weight:500;cursor:pointer}
.radios label:has(input:checked){border-color:var(--fg);background:var(--surface-2)}
.radios input{accent-color:var(--fg);margin:0}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--blue);margin:0}
.divider{height:1px;background:var(--line)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Map ---------- */
.mapwrap{position:absolute;inset:0;overflow:hidden;background:var(--map-land);touch-action:none;cursor:grab}
.mapwrap.dragging{cursor:grabbing}
.maplayer{position:absolute;left:0;top:0;width:760px;height:1040px;will-change:transform}
.maplayer svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);min-width:44px;height:44px;display:flex;align-items:flex-end;justify-content:center;border:0;background:transparent;padding:0;z-index:2}
.pin span{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:15px;background:var(--surface);color:var(--fg);font-size:12.5px;font-weight:700;box-shadow:0 2px 6px rgba(10,10,11,.22);white-space:nowrap;position:relative;margin-bottom:6px;border:1.5px solid var(--surface)}
.pin span::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:var(--surface)}
.pin.saved span{border-color:var(--blue)}
.pin[aria-pressed="true"]{z-index:4}
.pin[aria-pressed="true"] span{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);transform:scale(1.12);transform-origin:bottom center}
.pin[aria-pressed="true"] span::after{border-top-color:var(--btn)}
.maptop{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-direction:column;gap:10px;padding-top:4px;pointer-events:none}
.maptop > *{pointer-events:auto}
.search{margin:0 var(--m);display:flex;align-items:center;gap:10px;min-height:50px;padding:0 6px 0 16px;background:var(--surface);border-radius:var(--r-pill);box-shadow:var(--shadow);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;min-height:44px;outline:none}
.search .ic{color:var(--muted);display:flex}
.chips .chip{box-shadow:0 1px 3px rgba(10,10,11,.08)}
.area-pill{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:5}
.area-pill .btn{min-height:44px;font-size:14px;box-shadow:var(--shadow)}
.mapbottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:10px;padding:0 var(--m) 14px;pointer-events:none}
.mapbottom > *{pointer-events:auto}
.switch-row{display:flex;justify-content:center}
.toggle{display:flex;background:var(--btn);border-radius:var(--r-pill);padding:4px;box-shadow:var(--shadow)}
.toggle button{min-height:40px;padding:0 16px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--btn-fg);opacity:.7;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--fg);opacity:1}
.preview{display:flex;gap:12px;align-items:stretch;padding:12px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);text-align:left;width:100%}
.thumb{width:84px;border-radius:12px;flex:none;position:relative;overflow:hidden;min-height:84px}
.thumb .ph-img,.imgbox .ph-img{position:absolute;inset:0}
.thumb svg.motif{width:56%;right:20%;bottom:20%}
.meta .mi{display:inline-flex;align-items:center;gap:5px}
.preview .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.preview h4{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.price{display:inline-flex;align-items:baseline;gap:6px;font-size:13px}
.price b{font-weight:700;color:var(--fg)}
.price em{font-style:normal;color:var(--muted);font-size:12px}

/* image placeholders */
.ph-img{position:relative;overflow:hidden;background:var(--surface-2);border:1px dashed var(--line-strong)}
.ph-img::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - .5px),var(--line-strong) 50%,transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),var(--line-strong) 50%,transparent calc(50% + .5px))}
.ph-img svg.motif{display:none}
.cat-art{--c1:#fde68a;--c2:#fcd34d;--c3:#fbbf24;--c4:#78350f}
.cat-make{--c1:#fed7aa;--c2:#fdba74;--c3:#fb923c;--c4:#7c2d12}
.cat-out{--c1:#bae6fd;--c2:#7dd3fc;--c3:#86efac;--c4:#0c4a6e}
.cat-food{--c1:#fecaca;--c2:#fca5a5;--c3:#fde68a;--c4:#7f1d1d}
.cat-games{--c1:#ddd6fe;--c2:#c4b5fd;--c3:#a5b4fc;--c4:#3730a3}
.cat-music{--c1:#e9d5ff;--c2:#f0abfc;--c3:#c4b5fd;--c4:#581c87}
.cat-active{--c1:#bbf7d0;--c2:#86efac;--c3:#bae6fd;--c4:#14532d}

/* list */
.lcard{display:flex;gap:14px;padding:12px;border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;align-items:stretch}
.lcard[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.lcard .thumb{width:92px;min-height:92px}

.opt-h .thumb{width:52px;min-height:52px;height:52px;border-radius:10px}
.opt-h h4{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.vote{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.vote button[aria-pressed="true"][data-v="yes"]{background:var(--green-tint);border-color:var(--green);color:var(--green-ink)}

.tally{display:flex;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.tally b{color:var(--fg);font-weight:700}

.count{border-radius:14px;padding:10px 8px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}

function vPlans(){const st=S.states.plans||'ready';
 const head=`<div class="big" style="padding-top:8px;padding-bottom:16px"><h2>Plans</h2></div>`;
 if(st!=='ready')return `<div class="screen">${head}<div class="scroll">${stateView(st)}</div>${tabs()}</div>`;
 const p=S.plan;const e=p.exp?E(p.exp):null;const me=viewer();
 const item=(o)=>`<button class="pitem ${o.cls||''}" data-a="${o.a}" data-v="${o.v||''}"><div class="date"><small>${o.dow}</small><b>${o.d}</b></div><div style="flex:1;min-width:0"><h4>${esc(o.title)}</h4><div class="small muted" style="margin:2px 0 4px">${esc(o.sub)}</div>${o.tag||''}</div><span class="muted">${ic('chev',18)}</span></button>`;
 const need=[],picks=[],up=[],drafts=[],past=[];
 if(p.status==='sent'){const my=isOrg()?'going':(p.rsvp[me]||'awaiting');const c=counts();
  const o={a:'go',v:'plan',dow:p.date.slice(0,3),d:p.day,title:e.name,sub:`${range(p)}, Saturday crew`};
  if(!isOrg()&&my==='reconfirm')need.push({...o,cls:'attn',tag:statusTag('reconfirm')});
  else if(!isOrg()&&my==='awaiting')need.push({...o,cls:'attn',tag:`<span class="tag att">${ic('clock',13)}Awaiting your response</span>`});
  else up.push({...o,tag:`<span class="tag go">${c.going} Going</span> ${c.reconfirm?`<span class="tag att">${c.reconfirm} to reconfirm</span>`:''} ${statusTag(my)}`})}
 if(p.status==='cancelled')up.push({a:'go',v:'plan',cls:'cancelled',dow:p.date.slice(0,3),d:p.day,title:e.name,sub:`${range(p)}, Saturday crew`,tag:`<span class="tag bad">${ic('ban',13)}Cancelled</span>`});
 if(p.status==='draft'&&isOrg())drafts.push({a:'go',v:'create',dow:p.date.slice(0,3),d:p.day,title:e.name,sub:'Not sent. Only you can see this.',tag:'<span class="tag wait">Draft</span>'});
 if(isOrg())drafts.push({a:'noop',dow:'Sat',d:28,title:'Rooftop film night',sub:'Not sent. Only you can see this.',tag:'<span class="tag wait">Draft</span>'});
 if(S.pick.status==='open'||S.pick.status==='closed'&&p.status==='none'){const vd=voted().includes(me);
  picks.push({a:'go',v:'pick',cls:S.pick.status==='open'&&!vd?'attn':'',dow:'Pick',d:S.pick.options.length,title:'What should we do this weekend?',sub:S.pick.status==='open'?`Closes ${fmtT(S.pick.deadline)}`:`Closed. ${E(winnerId()).name} won.`,tag:S.pick.status==='open'?(vd?`<span class="tag go">${ic('check',13,2.4)}You voted</span>`:`<span class="tag att">Vote needed</span>`):`<span class="tag go">Winner picked</span>`})}
 if(S.pick.status==='draft'&&isOrg())picks.push({a:'go',v:'pick',dow:'Pick',d:S.pick.options.length,title:'New group pick',sub:'Not open yet',tag:'<span class="tag wait">Draft</span>'});
 up.push({a:'noop',dow:'Sat',d:21,title:'Clay and conversation',sub:'10:00–11:30 AM, UT design studio, organized by Priya',tag:`<span class="tag go">4 Going</span> <span class="tag att">Booking required</span> ${statusTag('going')}`});
 past.push({a:'noop',cls:'past',dow:'Sat',d:31,title:'Food truck crawl, East Cesar Chavez',sub:'Oct 31, 5 went',tag:''});
 past.push({a:'noop',cls:'past cancelled',dow:'Sat',d:7,title:'Sunset kayak on Lady Bird Lake',sub:'Nov 7, cancelled by Sam: wind advisory on the lake',tag:'<span class="tag bad">Cancelled</span>'});
 const sec=(t,arr,extra='',quiet)=>arr.length?`<div class="sec ${quiet?'quiet':''}"><div class="sec-h"><h3>${t}</h3><span>${extra||arr.length}</span></div>${arr.map(item).join('')}</div>`:'';
 return `<div class="screen">${head}<div class="scroll" id="sc"><div class="wrap">
 ${need.length?sec('Needs your response',need):(!isOrg()?`<div class="notice ok">${ic('check',18)}<div>You're all caught up. Nothing needs your response.</div></div>`:'')}
 ${sec('Open group picks',picks)}
 ${isOrg()&&S.pick.status!=='draft'?`<button class="btn line sm" data-a="newPick" style="align-self:flex-start">${ic('plus',18)}Start a group pick</button>`:''}

 ${sec('Drafts',drafts,'Only you')}
 ${sec('Past',past,'',true)}
 </div></div>${tabs()}</div>`}

 if(sh==='edit'){const p=S.plan;const t=S.editTmp;const goingInv=p.recipients.filter(m=>p.rsvp[m]==='going').length;

  <div style="display:flex;gap:8px"><button class="btn line" style="flex:1" data-a="closeSheet">Keep as is</button><button class="btn" style="flex:1" data-a="saveEdit" ${material||t.note!==p.note?'':'disabled'}>Save changes</button></div>`}

 <div class="pcard"><p class="ph">Spec notes <small>for ${esc(SCREENS.find(x=>x[0]===s)[1])}</small></p><ul class="notes">${NOTES[s].map(n=>`<li>${n}</li>`).join('')}</ul></div>
 ${demo?`<div class="pcard"><p class="ph">Simulate</p><div class="demo">${demo}</div>${(s==='plan'||s==='plans')&&p.status!=='none'&&p.status!=='draft'?`<div class="tally-log">Now: ${c.going} Going, ${c.awaiting} Awaiting, ${c.cant} Can't go, ${c.reconfirm} Needs reconfirmation</div>`:''}</div>`:''}
 <div class="pcard" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="small muted">State is in memory only.</span><button class="link" data-a="d-resetall">Reset everything</button></div>`}

/* ================= Actions ================= */
function send(){const p=S.plan;if(S.sending)return;S.sending=true;S.sendError=false;render();
 setTimeout(()=>{S.sending=false;if(S.failNext){S.failNext=false;S.sendError=true;render();return}
  p.status='sent';p.rsvp={};p.recipients.forEach(m=>p.rsvp[m]='awaiting');p.log=[];logp(`Maya sent the invitation to ${p.recipients.length}`);S.sendError=false;
  S.hist=S.hist.filter(x=>x!=='create');go('plan',{noHist:true});toast(`Invitation sent. 1 Going, ${p.recipients.length} Awaiting.`)},1300)}
function materialEdit(start,date,meeting,note){const p=S.plan;const old={time:range(p),date:p.date,meeting:p.meeting};const dur=toMin(p.end)-toMin(p.start);
 const mat=start!==p.start||date!==p.date||meeting!==p.meeting;
 p.start=start;p.end=addMin(start,dur);p.date=date;p.day=+date.match(/\d+/)[0];p.meeting=meeting;p.note=note;
 if(mat){p.prev=old;let n=0;p.recipients.forEach(m=>{if(p.rsvp[m]==='going'){p.rsvp[m]='reconfirm';n++}});logp(`Maya changed the ${old.time!==range(p)||old.date!==p.date?'time to '+p.date+', '+range(p):'meeting point'}${n?`; ${n} need to reconfirm`:''}`);toast(n?`Saved. ${n} invitee${n>1?'s':''} asked to reconfirm.`:'Saved. Everyone was notified.')}
 else{logp('Maya updated the note');toast('Saved.')}}
const A={
 back, tab:v=>{S.hist=[];go(v==='map'?(S.view==='list'?'list':'map'):v,{noHist:true})},
 go:v=>go(v), jump:v=>{S.hist=[];go(v,{noHist:true})},
 view:v=>{S.view=v;go(v,{noHist:true})},
 ctx:v=>{S.ctx=v;render()},
 pin:v=>{S.selected=v;render()}, lsel:v=>{if(S.selected===v){go('detail')}else{S.selected=v;render()}},
 open:v=>{S.selected=v;go('detail')},
 sheet:v=>{if(v==='edit'){const p=S.plan;S.editTmp={start:p.start,date:p.date,meeting:p.meeting,note:p.note}}if(v==='cancel')S.cancelTmp={reason:'',other:''};S.sheet=v;render()},
 closeSheet:()=>{S.sheet=null;render()},
 fcat:v=>{S.filters.cat=v||null;S.sheet=null;render()}, fprice:v=>{S.filters.price=v;S.sheet=null;render()}, fdate:v=>{S.filters.date=v;S.sheet=null;render()},
 funknown:(v,el)=>{S.filters.unknown=el.checked;render()},
 clearFilters:()=>{S.filters={cat:null,price:'any',date:'any',unknown:true};S.ctx='explore';S.q='';S.area=null;S.states[S.screen]='ready';render()},
 clearArea:()=>{S.area=null;render()},
 searchArea:()=>{S.searching=true;render();setTimeout(()=>{const w=document.getElementById('mapwrap');const W=w?w.clientWidth:390,H=w?w.clientHeight:700;
  S.area={x0:-S.pan.x,x1:-S.pan.x+W,y0:-S.pan.y+150,y1:-S.pan.y+H-60};S.searching=false;S.panned=false;const n=results().length;
  if(n&&!results().some(e=>e.id===S.selected))S.selected=results()[0].id;render();toast(`${n} experience${n===1?'':'s'} in this area`)},700)},
 saveMe:()=>{if(!isOrg()){S.sheet=null;render();toast('Saving needs an account. Sign in to save.');return}const e=S.selected;const a=S.saves.me;const i=a.indexOf(e);i>=0?a.splice(i,1):a.push(e);S.sheet=null;render();toast(i>=0?'Removed from My saves':'Saved for you')},
 saveGroup:()=>{if(!isOrg()){S.sheet=null;render();toast('Saving needs an account. Sign in to save.');return}const e=S.selected;const a=S.saves.group;const i=a.indexOf(e);i>=0?a.splice(i,1):a.push(e);S.sheet=null;render();toast(i>=0?'Removed from Saturday crew\'s ideas':'Saved to Saturday crew. All 6 members can see it.')},
 startPlan:v=>{if(!isOrg()){toast('Switch to Maya to start a plan as organizer');return}if(S.plan.status==='sent'){S.plan=freshPlan()}S.draftExp=v;draftFrom(v);S.plan.fromPick=false;go('create')},
 addToPick:v=>{if(!isOrg()){S.sheet=null;render();toast('Starting or editing a pick needs an account.');return}S.pick.options.push(v);S.sheet=null;render();toast(`Added to the group pick (${S.pick.options.length} of 5)`)},
 pickWith:v=>{S.pick={...freshPick(),status:'draft',options:[v],votes:{}};S.sheet=null;go('pick')},
 vote:(v,el)=>{const o=el.dataset.o;const me=viewer();S.pick.votes[me]=S.pick.votes[me]||{};S.pick.votes[me][o]=v;render()},
 star:v=>{S.pick.starred=S.pick.starred===v?null:v;render()},
 rmOpt:v=>{S.pick.options=S.pick.options.filter(x=>x!==v);if(S.pick.starred===v)S.pick.starred=null;render()},
 addOpt:v=>{if(S.pick.options.length<5)S.pick.options.push(v);render()},
 hours:v=>{S.pick.hours=+v;render()},
 openVoting:()=>{const pk=S.pick;pk.status='open';pk.created=now();pk.deadline=now()+pk.hours*3600e3;pk.votes={};render();toast(`Voting open until ${fmtT(pk.deadline)}`)},
 closeNow:()=>A['d-deadline'](),
 draftWinner:()=>{S.plan=freshPlan();S.draftExp=winnerId();draftFrom(winnerId());go('create')},
 override:v=>{S.pick.override=v||null;S.sheet=null;render();toast(v?`Override shown to the group: ${E(v).name}`:'Back to the vote result')},
 rec:(v,el)=>{const r=S.plan.recipients;if(el.checked&&!r.includes(v))r.push(v);if(!el.checked)S.plan.recipients=r.filter(x=>x!==v);S.plan.recipients.sort((a,b)=>MEMBERS.indexOf(a)-MEMBERS.indexOf(b));render()},
 pdate:(v,el)=>{S.plan.date=el.value;S.plan.day=+el.value.match(/\d+/)[0];render()},
 pstart:(v,el)=>{const dur=toMin(S.plan.end)-toMin(S.plan.start);S.plan.start=el.value;if(dur>0)S.plan.end=addMin(el.value,dur);render()},
 pend:(v,el)=>{S.plan.end=el.value;render()},
 send,
 rsvp:v=>{if(isOrg())return;setRsvp('Jordan',v)},
 etmp:(v,el)=>{S.editTmp[el.dataset.k]=el.value;render()},
 saveEdit:()=>{const t=S.editTmp;materialEdit(t.start,t.date,t.meeting,t.note);S.sheet=null;render()},
 creason:v=>{S.cancelTmp.reason=v;render()},
 doCancel:()=>{const t=S.cancelTmp;S.plan.status='cancelled';S.plan.cancelReason=t.reason==='Other'?t.other.trim():t.reason;logp('Maya cancelled the plan: '+S.plan.cancelReason);S.sheet=null;render();toast('Plan cancelled. Everyone invited was notified.')},
 group:v=>{S.groupId=v;go('group')},
 copy:v=>{const done=()=>toast('Copied');try{navigator.clipboard.writeText(v).then(done,done)}catch(e){done()}if(S.sheet){S.sheet=null;render()}},
 revoke:()=>{const g=S.groups.find(x=>x.id===S.groupId);const AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='SQ';for(let i=0;i<4;i++)c+=AL[Math.floor(Math.random()*AL.length)];g.revoked=g.code;g.code=c;S.sheet=null;render();toast(`${g.revoked} revoked. New code: ${c}`)},
 createGroup:()=>{const n=S.newGroupName.trim()||'New group';const AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='SQ';for(let i=0;i<4;i++)c+=AL[Math.floor(Math.random()*AL.length)];
  const id='g'+Date.now();S.groups.push({id,name:n,members:[viewer()],pending:[],code:c});S.newGroupName='';S.sheet=null;S.groupId=id;go('group');toast(`${n} created. Share code ${c}.`)},
 joinCode:()=>{S.join={step:'code',code:'',name:'',err:'',email:'',via:''};go('join')},
 toSignin:()=>{S.join={step:'identity',code:'SQ7K2M',name:'Jordan',err:'',email:'',via:''};go('join')},
 checkCode:()=>{const c=S.join.code.trim().toUpperCase();S.states.join='ready';if(S.groups.some(g=>g.code===c)){S.join.step='preview';S.join.err=''}else{S.join.step='invalid';S.join.err=c==='SQ4XPL'||S.groups.some(g=>g.revoked===c)?'expired':'nomatch'}render()},
 openLink:()=>{S.join.code=S.groups[0].code;S.join.step='preview';S.states.join='ready';render()},
 jstep:v=>{S.join.step=v;S.join.err='';render()},
 guest:()=>{if(!S.join.name.trim()){S.join.err='name';render();return}S.role='jordan';S.jordanGuest=true;finishJoin(`Joined as ${S.join.name.trim()} (guest)`)},
 signin:v=>{S.join.via=v;S.join.step='working';render();setTimeout(()=>{S.role='jordan';S.jordanGuest=false;finishJoin(`Signed in with ${v}. Your responses carried over.`)},900)},
 subtab:v=>{S.sub.tab=v;render()},
 radio:(v,el)=>{S.sub.v[el.dataset.k]=el.value;delete S.sub.errs[el.dataset.k];render()},
 file:(v,el)=>{},
 retry:()=>{S.states[S.screen]='ready';if(S.screen==='join'){S.join.step='code';S.join.err=''}render()},
 emptyAct:v=>{S.states[S.screen]='ready';if(v==='clearFilters')return A.clearFilters();if(v==='tabmap'){S.hist=[];return go('map',{noHist:true})}if(v==='tabplans'){S.hist=[];return go('plans',{noHist:true})}if(v==='newgroup')return A.sheet('newgroup');if(v==='share')return A.sheet('share');render()},
 role:v=>{S.role=v;if(S.sheet)S.sheet=null;render()},
 sstate:v=>{S.states[S.screen]=v;render()},
 newPick:()=>{if(S.pick.status==='open'){go('pick');toast('A pick is already open. Close it before starting another.');return}S.pick={...freshPick(),status:'draft',options:[],votes:{}};go('pick')},
 noop:()=>toast('Sample item for layout. Not wired up in this prototype.'),
 cother:()=>{},
 etmpi:()=>{},
 /* demo */
 'd-tess':()=>{S.pick.votes.Tess={};S.pick.options.forEach(o=>S.pick.votes.Tess[o]=SEED_VOTES.Tess[o]||'no');render();toast('Tess voted. Tallies updated live.')},
 'd-fill':()=>{const alt=['yes','maybe','no'];MEMBERS.forEach((m,mi)=>{if(m===viewer()&&S.pick.votes[m])return;S.pick.votes[m]=S.pick.votes[m]||{};S.pick.options.forEach((o,oi)=>{if(!S.pick.votes[m][o])S.pick.votes[m][o]=(SEED_VOTES[m]&&SEED_VOTES[m][o])||alt[(mi+oi)%3]})});render()},
 'd-deadline':()=>{const pk=S.pick;if(pk.status!=='open')return;pk.status='closed';pk.closedAt=Math.min(now(),pk.deadline);if(pk.deadline>now())pk.closedAt=now();render();toast('Voting closed. '+E(winnerId()).name+' wins.')},
 'd-resetpick':()=>{S.pick=freshPick();render()},
 'd-newpick':()=>{S.role='maya';S.pick={...freshPick(),status:'draft',options:[],votes:{}};go('pick',{force:true})},
 'd-rsvp':v=>{const [w,r]=v.split(':');setRsvp(w,r)},
 'd-timechange':()=>{const p=S.plan;materialEdit('3:00 PM',p.date,p.meeting,p.note);render()},
 'd-resetplan':()=>{S.plan=freshPlan();S.draftExp=null;render()},
 'd-quicksend':()=>{S.plan=freshPlan();draftFrom(S.pick.status==='closed'?winnerId():'sketch');S.plan.status='sent';S.plan.recipients.forEach(m=>S.plan.rsvp[m]='awaiting');logp('Maya sent the invitation to 5');render();toast('Sent as Maya. 1 Going, 5 Awaiting.')},
 'd-fail':()=>{S.failNext=!S.failNext;render()},
 'd-code':v=>{if(v==='SQ7K2M')v=S.groups[0].code;else if(S.groups[0].revoked)v=S.groups[0].revoked;S.join={step:'code',code:v,name:'',err:'',email:'',via:''};S.states.join='ready';render()},
 'd-jreset':()=>{S.join={step:'code',code:'',name:'',err:'',email:'',via:''};S.states.join='ready';render()},
 'd-pan':()=>{S.pan.x-=90;S.pan.y+=60;S.panned=true;render()},
 'd-badsub':()=>{S.sub.tab='form';S.sub.v={name:'Lady Bird Lake loop walk',desc:'Nice walk',loc:'',tkind:'flexible',ttext:'',dur:'1 hr',pkind:'estimated',amt:'',src:'laketrail.org',img:''};S.sub.errs={};render()},
 'd-resetall':()=>{location.hash='';location.reload()}
};
function finishJoin(msg){S.hist=[];S.screen='plan';try{history.replaceState(null,'','#plan')}catch(e){}render(true);toast(msg)}
function validateSub(){const v=S.sub.v,e={};
 if(!v.name.trim())e.name='Add a name people will recognize.';
 if(v.desc.trim().length<20)e.desc=`Describe it in at least 20 characters (now ${v.desc.trim().length}).`;
 if(!v.loc.trim())e.loc='Add an address or meeting point in Austin.';
 if(!v.tkind)e.tkind='Choose fixed sessions or flexible hours.';
 else if(!v.ttext.trim())e.ttext=v.tkind==='fixed'?'List at least one session, like Sat 10:00 AM.':'Add the opening hours.';
 if(!v.dur.trim())e.dur='Add roughly how long it takes.';
 if(!v.pkind)e.pkind='Choose a price status. Pick Unknown if you aren\'t sure.';
 else if((v.pkind==='exact'||v.pkind==='estimated')&&!/\d/.test(v.amt))e.amt='Add the price per person, or choose Unknown.';
 if(!/^https?:\/\/[^\s.]+\.[^\s]+/.test(v.src.trim()))e.src='Use a full link that starts with https://';
 return e}

/* ================= Events ================= */
let suppressClick=false;
document.addEventListener('click',e=>{
 if(suppressClick){suppressClick=false;e.preventDefault();e.stopPropagation();return}
 const t=e.target.closest('[data-a]');if(!t)return;
 if(t.tagName==='INPUT'&&(t.type==='checkbox'||t.type==='radio'))return; // handled on change
 if(t.tagName==='SELECT'||t.tagName==='INPUT')return;
 const a=A[t.dataset.a];if(a){e.preventDefault();a(t.dataset.v,t)}},true);
document.addEventListener('change',e=>{const t=e.target.closest('[data-a]');if(!t)return;
 if(t.dataset.a==='file'){S.sub.v.img=t.files&&t.files[0]?t.files[0].name:'';render();return}
 const a=A[t.dataset.a];if(a)a(t.dataset.v,t)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.bind){const path=t.dataset.bind.split('.');let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=t.value;
  if(t.dataset.bind==='q'){S.area=null;render()}
  if(t.dataset.bind.startsWith('sub.v.')){const k=path[2];if(S.sub.errs[k]){delete S.sub.errs[k];if(k==='tkind'||k==='ttext')delete S.sub.errs.ttext}}}
 if(t.dataset.a==='etmpi'){S.editTmp[t.dataset.k]=t.value;clearTimeout(t._d);t._d=setTimeout(render,350)}
 if(t.dataset.a==='cother'){S.cancelTmp.other=t.value;const b=document.querySelector('[data-a="doCancel"]');if(b)b.disabled=!t.value.trim()}
 if(t.id==='ng'){}});
document.addEventListener('submit',e=>{if(e.target.id!=='subform')return;e.preventDefault();const er=validateSub();S.sub.errs=er;
 if(Object.keys(er).length){render();const k=Object.keys(er)[0];const map={name:'s-name',desc:'s-desc',loc:'s-loc',ttext:'s-tt',dur:'s-dur',amt:'s-amt',src:'s-src'};const el=document.getElementById(map[k]);if(el)el.focus();else{const x=document.getElementById('err-'+k);if(x)x.scrollIntoView({block:'center'})}return}
 S.subs.unshift({name:S.sub.v.name.trim(),status:'pending',date:'Nov 8'});S.sub.v={name:'',desc:'',loc:'',tkind:'',ttext:'',dur:'',pkind:'',amt:'',src:'',img:''};S.sub.tab='status';render();toast('Submitted for review')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});

/* map drag */
let drag=null;
document.addEventListener('pointerdown',e=>{const w=e.target.closest('#mapwrap');if(!w||e.button!==0)return;drag={x:e.clientX,y:e.clientY,px:S.pan.x,py:S.pan.y,moved:false,w}});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;drag.w.classList.add('dragging');
 const W=drag.w.clientWidth,H=drag.w.clientHeight;S.pan.x=Math.min(0,Math.max(W-760,drag.px+dx));S.pan.y=Math.min(60,Math.max(H-1040,drag.py+dy));
 const l=document.getElementById('maplayer');if(l)l.style.transform=`translate(${S.pan.x}px,${S.pan.y}px)`});
window.addEventListener('pointerup',()=>{if(!drag)return;const m=drag.moved;drag.w.classList.remove('dragging');drag=null;
 if(m){suppressClick=true;setTimeout(()=>suppressClick=false,0);if(!S.panned){S.panned=true;render()}}});

/* tick */
setInterval(()=>{const el=document.querySelector('[data-countdown]');if(el&&S.pick.status==='open'){const ms=S.pick.deadline-now();el.textContent=left(ms);if(ms<=0)A['d-deadline']()}
 const sb=document.querySelector('.sbar span');if(sb)sb.textContent=fmtClock(now())},1000);

/* boot */
const h=(location.hash||'').slice(1);if(VIEWS[h])S.screen=h;
render(true);
})();
</script>
