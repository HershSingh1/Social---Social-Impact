# Local development parity. Linking does NOT apply these Auth settings remotely.
project_id = "sidequest-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "1MiB"
allowed_mime_types = ["image/jpeg"]

[storage.buckets.listing-images]
public = true
file_size_limit = "1MiB"
allowed_mime_types = ["image/jpeg"]

[storage.buckets.album]
public = false
file_size_limit = "15MiB"
allowed_mime_types = ["image/jpeg"]

[auth]
enabled = true
site_url = "sidequest://"
additional_redirect_urls = ["sidequest://auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Sidequest sign-in code"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.confirmation]
subject = "Your Sidequest sign-in code"
content_path = "./supabase/templates/email-code.html"

# Google is a P0 sign-in method (D2). Put both values in supabase/.env (see
# supabase/.env.example); the hosted project is set in the dashboard (docs/dev-project.md).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
